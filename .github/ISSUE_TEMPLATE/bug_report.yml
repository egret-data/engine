name: Bug report
description: Report incorrect behavior, wrong results, or a crash
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: SQL statements, configuration, and data needed to reproduce.
      render: sql
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Deployment (Kubernetes, docker-compose, binary), catalog (Lakekeeper, Polaris, ...), object store, client.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
